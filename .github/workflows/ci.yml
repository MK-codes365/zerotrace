name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Core Engines & Backend Tests ──────────────────────────────
  test-engines:
    name: Test Core Engines & Cryptography (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic pydantic-settings cryptography sqlalchemy structlog aiofiles httpx fastapi orjson

      - name: Run Forensic & Sanitization Engine Tests
        env:
          PYTHONPATH: platform:platform/backend
        run: |
          python -m pytest platform/tests/test_engines.py -v --durations=10

      - name: Syntax Check Backend Modules
        run: |
          python -m compileall platform/backend/app platform/engines -q

  # ─── 2. Web Platform Frontend Build ─────────────────────────────────
  build-frontend:
    name: Build Web Portal & Landing Page (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: platform/frontend
        run: npm ci

      - name: Build Web Application Bundle
        working-directory: platform/frontend
        run: npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: platform/frontend/dist/
          retention-days: 7
